
name: Temperature Application CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # JOB 1: Maven Compilation and JUnit Testing
  maven-build:
    name: Java Maven Build and JUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and execute JUnit tests
        run: mvn -B clean verify

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # JOB 2: Docker Image Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs: maven-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t temperature:latest .

      - name: Verify Docker image
        run: docker images temperature
